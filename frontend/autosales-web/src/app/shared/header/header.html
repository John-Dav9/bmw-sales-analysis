<header class="topbar">
  <div class="wrap">
    <!-- 🏠 Logo -->
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <span class="logo">🚗</span>
      <span class="title">Auto Sales Analytics</span>
    </a>

    <!-- 🧭 Navigation -->
    <nav class="nav" [class.open]="menuOpen">
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">Dashboard</a>
      <a routerLink="/insights" routerLinkActive="active" (click)="closeMenu()">Insights</a>
      <a routerLink="/data-story" routerLinkActive="active" (click)="closeMenu()">Data Story</a>
      <a routerLink="/methodo" routerLinkActive="active" (click)="closeMenu()">Méthodo</a>
      <a routerLink="/use-cases" routerLinkActive="active" (click)="closeMenu()">Cas d’usage</a>

      <!-- 👑 Lien Admin visible seulement si admin -->
      <a *ngIf="auth.isAdmin()" routerLink="/explore" routerLinkActive="active" (click)="closeMenu()">Explore</a>
      <a *ngIf="auth.isAdmin()" routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
      <a routerLink="/admin" routerLinkActive="active" (click)="closeMenu()">Admin</a>

      <ng-template #loggedIn>
        <button mat-stroked-button color="warn" (click)="logout()">
          <mat-icon>logout</mat-icon>
          Logout
        </button>
      </ng-template>
    </nav>

    <!-- 🍔 Burger (mobile) -->
    <button mat-icon-button class="burger" (click)="toggleMenu()" aria-label="Menu">
      <mat-icon>{{ menuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>
</header>
